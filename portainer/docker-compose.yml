services:  
  portainer:
    container_name: portainer
    image: portainer/portainer-ee:lts
    networks:
      - oneblock_oneblock_network
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    # ports:
    #   - 9443:9443
    #   - 8000:8000  # Remove if 
volumes:
  portainer_data:
    name: portainer_data
networks:
  oneblock_oneblock_network:
    external: true