  backend:
    container_name: oneblock_backend
    build:
      context: ./be
    # ports:
      # - "8080:80"
      # - "8081:81"
    restart: always  
    depends_on:
      - db
    environment:
      - GIN_MODE=release
      # - GIN_MODE=dev
    volumes:
      - appdata:/home/sondq/appdata
      - ./libwebp-1.2.0-linux-x86-64/bin/:/app/.bin/webp/
    networks:
      - oneblock_network

  
  landing-cms-publisher:
    container_name: oneblock_landing_cms_publisher
    build:
      context: ./oneblock-landing-publisher
    ports:
      - "8200:80"    
    restart: always 
    networks:
      - oneblock_network

  db:
    image: postgres:17.2
    restart: always
    # set shared memory limit when using docker-compose
    shm_size: 512mb
    # or set shared memory limit when deploy via swarm stack
    #volumes:
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    environment:
      POSTGRES_PASSWORD: 
    volumes:
        - dbdata:/var/lib/postgresql/data
    ports:
      - "8432:5432"
    networks:
      - oneblock_network

  backup:
    image: postgres:17.2
    restart: unless-stopped
    environment:
      PGPASSWORD: oneblock_db_pass                # so pg_dump won't prompt
      PGUSER: postgres
      PGDATABASE: oneblock
      PGHOST: 103.82.133.178
    volumes:
      - backups:/backups
    entrypoint: >
      bash -c '
        set -euo pipefail
        while true; do
          ts=$$(date +%F_%H-%M-%S)
          file="/backups/backup-$${ts}.sql.gz"
          echo "Creating $${file}"
          pg_dump -h "$PGHOST" -p 8432 -U "$PGUSER" "$PGDATABASE" | gzip -c > "$$file"
          echo "Created $${file}"
          # keep last 7 days locally
          # find /backups -type f -name "backup-*.sql.gz" -mtime +7 -delete
          sleep 3600
        done
      '

  s3sync:
    image: amazon/aws-cli:2.17.52
    restart: unless-stopped
    depends_on:
      - backup
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-southeast-1}
      S3_BUCKET: ${S3_BUCKET}
      S3_PREFIX: ${S3_PREFIX:-postgres}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      AWS_S3_FORCE_PATH_STYLE: ${AWS_S3_FORCE_PATH_STYLE:-false}
    volumes:
      - backups:/backups:ro
    entrypoint: >
      sh -c '
        set -euo pipefail
        dest="s3://${S3_BUCKET}/${S3_PREFIX}"
        args=""
        if [ -n "$${S3_ENDPOINT}" ]; then
          args="--endpoint-url $${S3_ENDPOINT}"
        fi
        sleep 10 
        while true; do                   
          aws s3 sync /backups "$${dest}" $${args}           
          sleep 60
        done
      '

  adguardhome:
    image: adguard/adguardhome:v0.107.69
    container_name: adguardhome
    restart: unless-stopped
    networks:
      - oneblock_network
    volumes:
      - adguardhome:/opt/adguardhome/work
      - adguardhome:/opt/adguardhome/conf
      - ./privkey.pem:/opt/adguardhome/ssl/privkey.pem
      - ./fullchain.pem:/opt/adguardhome/ssl/fullchain.pem
    ports:
      # - "53:53/tcp"
      # - "53:53/udp"
      # - "67:67/udp"
      # - "68:68/udp"
      # - "180:80/tcp"
      # - "2443:443/tcp"
      # - "2443:443/udp"
      # - "3000:3000/tcp"
      - "853:853/tcp" # DNS-over-TLS (DoT)
      # - "853:853/udp"
      - "784:784/udp" # DNS-over-QUIC (DoQ)
      - "8853:8853/udp" # Alternate DNS-over-QUIC port
      # - "5443:5443/tcp"
      # - "5443:5443/udp"

    healthcheck:
      test: ["CMD", "nslookup", "healthcheck.adguardhome.test.", "127.0.0.1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  adguardian1:
    image: sdjnmxd/adguardian-web
    container_name: adguardian-web
    restart: unless-stopped
      # - "181:7681/tcp"
  adguard-exporter:
    image: ghcr.io/henrywhitaker3/adguard-exporter:latest
    container_name: adguard-exporter
    restart: unless-stopped
    # ports:
    #   - "9618:9618"
    environment:
      ADGUARD_SERVERS: http://adguardhome
      ADGUARD_USERNAMES: ${ADGUARD_USERNAME}
      ADGUARD_PASSWORDS: ${ADGUARD_PASSWORD}
      INTERVAL: "15s" # Optional, defaults
    networks:
      - oneblock_network

  beszel:
    image: henrygd/beszel
    container_name: beszel
    restart: unless-stopped
    ports:
      - 8090:8090
    volumes:
      - ./beszel_data:/beszel_data
      - ./beszel_socket:/beszel_socket
     
    networks:
      - oneblock_network

  beszel-agent:
    image: henrygd/beszel-agent:latest
    depends_on:
      - beszel
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - beszel_agent_data:/var/lib/beszel-agent
      - ./beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro
    security_opt:
      - apparmor:unconfined
    environment:
      LISTEN: /beszel_socket/beszel.sock
      KEY:  'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEmGdorML2JRPbDAkDxAjGwGkSx+G0Z1P/Zr7nUqt7eV'
      TOKEN: bb782c4b-607d-4795-bc9c-56ec99a17fcc
      HUB_URL: https://beszel.oneblock.vn

  netdata:
    image: netdata/netdata:stable
    container_name: netdata
    pid: host
    network_mode: host
    restart: unless-stopped
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - netdataconfig:/etc/netdata
      - netdatalib:/var/lib/netdata
      - netdatacache:/var/cache/netdata
      - /:/host/root:ro,rslave
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/localtime:/etc/localtime:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/log:/host/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/dbus:/run/dbus:ro
    environment:
      - NETDATA_CLAIM_TOKEN=mAzEq7b7-OjaMBt3uDHnACnhKcCkBc04Yob3AJMnrXNgH8MwDf1GbTJBbCEzQ1x7hsKGIIIdqhFrY_LylzCMMANcv_oCXHir75n5u8MifImG6JRwOS7mae3NFYloOG7lamvwyzM
      - NETDATA_CLAIM_URL=https://app.netdata.cloud
      - NETDATA_CLAIM_ROOMS=57eda090-8c00-43c1-adfe-8c95111d9fe6

  webcuuhokhancap:
    container_name: webcuuhokhancap
    build:
      context: ./WebCuuHoKhanCap
    # ports:
    #   - "8200:80"    
    restart: always 
    networks:
      - oneblock_network

