  backend:
    container_name: oneblock_backend
    build:
      context: ./be
    # ports:
      # - "8080:80"
      # - "8081:81"
    restart: always  
    depends_on:
      - db
    environment:
      - GIN_MODE=release
      # - GIN_MODE=dev
    volumes:
      - appdata:/home/sondq/appdata
      # - ./libwebp-1.2.0-linux-x86-64/bin/:/app/.bin/webp/
      - ./libwebp-1.6.0-linux-x86-64/bin/:/app/.bin/webp/ 
    networks:
      - oneblock_network

  
  landing-cms-publisher:
    container_name: oneblock_landing_cms_publisher
    build:
      context: ./oneblock-landing-publisher
    ports:
      - "8200:80"    
    restart: always 
    networks:
      - oneblock_network

  db:
    image: postgres:17.2
    # container_name: postgres
    restart: always
    # set shared memory limit when using docker-compose
    shm_size: 512mb
    # or set shared memory limit when deploy via swarm stack
    #volumes:
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
        - dbdata:/var/lib/postgresql/data
    ports:
      - "8432:5432"
    networks:
      - oneblock_network

  backup:
    image: postgres:17.2
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}                # so pg_dump won't prompt
      PGUSER: postgres
      PGDATABASE: oneblock
      PGHOST: 103.82.133.178
    volumes:
      - backups:/backups
    entrypoint: >
      bash -c '
        set -euo pipefail
        while true; do
          ts=$$(date +%F_%H-%M-%S)
          file="/backups/backup-$${ts}.sql.gz"
          echo "Creating $${file}"
          pg_dump -h "$PGHOST" -p 8432 -U "$PGUSER" "$PGDATABASE" | gzip -c > "$$file"
          echo "Created $${file}"
          # keep last 7 days locally
          # find /backups -type f -name "backup-*.sql.gz" -mtime +7 -delete
          sleep 86400
        done
      '

  s3sync:
    image: amazon/aws-cli:2.17.52
    restart: unless-stopped
    depends_on:
      - backup
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-southeast-1}
      S3_BUCKET: ${S3_BUCKET}
      S3_PREFIX: ${S3_PREFIX:-postgres}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      AWS_S3_FORCE_PATH_STYLE: ${AWS_S3_FORCE_PATH_STYLE:-false}
    volumes:
      - backups:/backups:ro
    entrypoint: >
      sh -c '
        set -euo pipefail
        dest="s3://${S3_BUCKET}/${S3_PREFIX}"
        args=""
        if [ -n "$${S3_ENDPOINT}" ]; then
          args="--endpoint-url $${S3_ENDPOINT}"
        fi
        sleep 10 
        while true; do                   
          aws s3 sync /backups "$${dest}" $${args}           
          sleep 60
        done
      '

  rclone-sync-worker:
    image: rclone/rclone:latest
    container_name: s3-cross-endpoint-sync
    environment:
      # --- Cấu hình Nguồn (Source) ---
      - RCLONE_CONFIG_MYSOURCE_TYPE=s3
      - RCLONE_CONFIG_MYSOURCE_PROVIDER=Other
      - RCLONE_CONFIG_MYSOURCE_ENV_AUTH=true
      - RCLONE_CONFIG_MYSOURCE_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - RCLONE_CONFIG_MYSOURCE_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - RCLONE_CONFIG_MYSOURCE_ENDPOINT=${S3_ENDPOINT}
      
      # --- Cấu hình Đích (Destination) ---
      - RCLONE_CONFIG_MYDEST_TYPE=s3
      - RCLONE_CONFIG_MYDEST_PROVIDER=Other
      - RCLONE_CONFIG_MYDEST_ENV_AUTH=true
      - RCLONE_CONFIG_MYDEST_ACCESS_KEY_ID=${S3_DST_ACCESS_KEY}
      - RCLONE_CONFIG_MYDEST_SECRET_ACCESS_KEY=${S3_DST_SECRET_KEY}
      - RCLONE_CONFIG_MYDEST_ENDPOINT=${S3_DST_ENDPOINT}
      
    entrypoint: 
      - /bin/sh
      - -c
      - |
        echo "Starting Global S3 Sync Service..."
        while true; do
          echo "[$(date)] Starting FULL sync from Endpoint A to Endpoint B..."
          
          # LỆNH QUAN TRỌNG:
          # mysource: (có dấu hai chấm) nghĩa là root của source
          # mydest: (có dấu hai chấm) nghĩa là root của dest
          # --create-empty-src-dirs: Đảm bảo copy cả các bucket rỗng
          # --transfers 16: Tăng tốc độ (copy 16 file cùng lúc)
          
          rclone sync mysource: mydest: \
            --create-empty-src-dirs \
            --transfers 16 \
            --progress
          
          echo "[$(date)] Sync completed. Sleeping for 24 hour..."
          sleep 86400
        done
    restart: unless-stopped

  adguardhome:
    image: adguard/adguardhome:v0.107.71
    container_name: adguardhome
    restart: unless-stopped
    networks:
      - oneblock_network
    volumes:
      - adguardhome:/opt/adguardhome/work
      - adguardhome:/opt/adguardhome/conf
      - ./privkey.pem:/opt/adguardhome/ssl/privkey.pem
      - ./fullchain.pem:/opt/adguardhome/ssl/fullchain.pem
      - caddy_data:/shared/caddy-data:ro
    ports:
      # - "53:53/tcp"
      # - "53:53/udp"
      # - "67:67/udp"
      # - "68:68/udp"
      # - "180:80/tcp"
      # - "2443:443/tcp"
      # - "2443:443/udp"
      # - "3000:3000/tcp"
      - "853:853/tcp" # DNS-over-TLS (DoT)
      # - "853:853/udp"
      - "784:784/udp" # DNS-over-QUIC (DoQ)
      - "8853:8853/udp" # Alternate DNS-over-QUIC port
      # - "5443:5443/tcp"
      # - "5443:5443/udp"

    healthcheck:
      test: ["CMD", "nslookup", "healthcheck.adguardhome.test.", "127.0.0.1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on: [caddy]      

  adguardian1:
    image: sdjnmxd/adguardian-web
    container_name: adguardian-web
    restart: unless-stopped
      # - "181:7681/tcp"
  adguard-exporter:
    image: ghcr.io/henrywhitaker3/adguard-exporter:latest
    container_name: adguard-exporter
    restart: unless-stopped
    # ports:
    #   - "9618:9618"
    environment:
      ADGUARD_SERVERS: http://adguardhome
      ADGUARD_USERNAMES: ${ADGUARD_USERNAME}
      ADGUARD_PASSWORDS: ${ADGUARD_PASSWORD}
      INTERVAL: "15s" # Optional, defaults
    networks:
      - oneblock_network

  beszel:
    image: henrygd/beszel
    container_name: beszel
    restart: unless-stopped
    ports:
      - 8090:8090
    volumes:
      - ./beszel_data:/beszel_data
      - ./beszel_socket:/beszel_socket
     
    networks:
      - oneblock_network

  beszel-agent:
    image: henrygd/beszel-agent:latest
    depends_on:
      - beszel
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - beszel_agent_data:/var/lib/beszel-agent
      - ./beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro
    security_opt:
      - apparmor:unconfined
    environment:
      LISTEN: /beszel_socket/beszel.sock
      KEY: ${BESZEL_KEY}
      TOKEN: ${BESZEL_TOKEN}
      HUB_URL: https://beszel.oneblock.vn

  portainer:
    image: portainer/portainer-ee:lts
    container_name: portainer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    # ports:
      # - "9000:9000"
    networks:
      - oneblock_network

  cowrie:
    image: cowrie/cowrie
    # build:
    #   context: ./honeyspot/cowrie
    container_name: cowrie
    restart: unless-stopped
    environment:
      # Configure Cowrie to use the PostgreSQL output plugin
      COWRIE_OUTPUT_POSTGRES_ENABLED: "yes"
      COWRIE_OUTPUT_POSTGRES_HOST: ${POSTGRES_HOST} # Service name in docker-compose
      COWRIE_OUTPUT_POSTGRES_DATABASE: "cowrie"
      COWRIE_OUTPUT_POSTGRES_USERNAME: ${POSTGRES_USER}
      COWRIE_OUTPUT_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      COWRIE_OUTPUT_POSTGRES_PORT: "8432"
    volumes:
      - ./honeyspot/cowrie.cfg.dist:/cowrie/cowrie-git/etc/cowrie.cfg.dist
      - ./honeyspot/userdb.txt:/cowrie/cowrie-git/etc/userdb.txt
      - ./honeyspot/cowrie_data/etc:/cowrie/etc # For persistent config files
      - ./honeyspot/cowrie_data/var:/cowrie/var # For persistent logs/downloads
    ports:
      - "22:2222"
    depends_on:
      - db
    networks:
      - oneblock_network
    deploy:
      resources:
        limits:
          cpus: '0.50'    # Giới hạn tối đa 50% của 1 core CPU
          memory: 512M    # Giới hạn tối đa 512MB RAM
        reservations:
          cpus: '0.10'    # Đảm bảo tối thiểu 10% CPU
          memory: 128M    # Đảm bảo tối thiểu 128MB RAM


  email-to-pdf:
    build:
      context: ./auto_print
      dockerfile: Dockerfile
    container_name: email-to-pdf-automation
    restart: unless-stopped
    
    # Environment variables
    env_file:
      - .env
    
    # Volumes for persistent data
    volumes:
      - output:/app/output
      - logs:/app/logs
      - ./auto_print/.env:/app/.env:ro
    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Resource limits (optional but recommended)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    # Security options
    security_opt:
      - no-new-privileges:true
    
    # Read-only root filesystem (output and logs are writable via volumes)
    read_only: false
     # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


volumes:
  appdata:
  dbdata:
  backups:
  adguardhome: 
  subspacedata: 
  dnsmasq:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana-storage:
  beszel_agent_data:
  netdataconfig:
  netdatalib:
  netdatacache:
  portainer_data:
  logs:
  output:
networks:
  oneblock_network:
