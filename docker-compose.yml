services:  
  caddy-fmt:
    image: caddy:2.10.2
    entrypoint: ["caddy", "fmt", "--overwrite", "/etc/caddy/Caddyfile"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    
  caddy:
    container_name: caddy
    image: caddy:2.10.2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - oneblock_network
    depends_on: [caddy-fmt]

