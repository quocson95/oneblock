# prometheus.yaml
global:
  scrape_interval: 1m # default is 1 minute
  scrape_timeout: 15s
scrape_configs:

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: caddy
    static_configs:
      - targets: ['caddy:2019']

  - job_name: 'node'
    static_configs:
      - targets: ['node_exporter:9100']

  - job_name: 'mtg-proxy'
    static_configs:
      - targets: ['10.0.0.1:1444']

  - job_name: 'adguard'
    static_configs:
      - targets: ['adguard-exporter:9618']
      